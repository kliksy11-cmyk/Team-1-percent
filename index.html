<!DOCTYPE html>

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#000;color:#fff;min-height:100vh;}
.container{max-width:500px;margin:0 auto;padding:20px;padding-bottom:100px;}
h1{margin:0;font-family:monospace;font-size:24px;font-weight:900;letter-spacing:2px;color:#fff;}
h1 span{color:#7CFF4F;}
h2{margin:24px 0 12px;font-size:12px;color:#888;text-transform:uppercase;letter-spacing:2px;font-family:monospace;}
input,select,textarea{width:100%;padding:14px;margin-bottom:10px;border:1px solid #222;border-radius:8px;background:#0a0a0a;color:#fff;font-size:15px;outline:none;}
input:focus,select:focus{border-color:#7CFF4F;}
button{padding:14px;border:none;border-radius:8px;background:#111;color:#fff;font-size:14px;cursor:pointer;font-weight:bold;border:1px solid #222;}
button.primary{background:#7CFF4F;color:#000;border:none;box-shadow:0 0 10px rgba(124,255,79,0.2);}
button:disabled{opacity:0.5;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.header-actions{display:flex;align-items:center;gap:10px;}
.lang-btn{background:#111;color:#fff;border:1px solid #333;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:bold;}
.streak{background:#7CFF4F22;color:#7CFF4F;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:14px;border:1px solid #7CFF4F;}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:20px;}
.box{aspect-ratio:1;background:#111;border-radius:3px;border:1px solid #222;}
.box.done{background:#7CFF4F;border-color:#7CFF4F;box-shadow:0 0 5px #7CFF4F;}
.task{display:flex;align-items:center;gap:10px;padding:14px;background:#0a0a0a;border-radius:8px;margin-bottom:10px;border:1px solid #222;}
.task.done{border-color:#7CFF4F;background:#7CFF4F11;}
.task .icon{font-size:20px;}
.task .label{flex:1;font-weight:600;font-size:14px;}
.upload-btn{background:#111;padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #333;}
.timer-box{background:#0a0a0a;padding:15px;border-radius:10px;margin-bottom:15px;border:1px dashed #7CFF4F;}
.timer-val{font-family:monospace;font-size:36px;color:#7CFF4F;font-weight:bold;text-align:center;margin:15px 0;letter-spacing:2px;}
.nonce{background:#7CFF4F11;border:1px dashed #7CFF4F;padding:15px;border-radius:8px;text-align:center;margin-bottom:20px;}
.nonce-code{font-size:24px;font-weight:900;letter-spacing:5px;color:#7CFF4F;font-family:monospace;}
.card{background:#0a0a0a;padding:15px;border-radius:8px;margin-bottom:10px;border:1px solid #222;}
.rank-card{background:#0a0a0a;padding:20px;border-radius:12px;border:1px solid #222;border-left:4px solid #7CFF4F;margin-bottom:20px;}
.xp-bar{height:6px;background:#111;border-radius:3px;margin-top:10px;overflow:hidden;}
.xp-bar-fill{height:100%;background:#7CFF4F;transition:0.3s;}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0;z-index:10;}
nav button{background:none;color:#666;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;width:auto;padding:0;}
nav button.active{color:#7CFF4F;}
nav button span{font-size:20px;}
.add-task{display:flex;gap:5px;margin-top:10px;}
.add-task input{margin-bottom:0;flex:1;}
.add-task button{width:auto;padding:0 15px;background:#7CFF4F;color:#000;}
.delete-btn{background:none;border:none;color:#ff4f4f;font-size:16px;padding:0 5px;cursor:pointer;}
</style>
</head>

const sb = createClient('https://ufwrdfsovhbjxghuwijz.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmd3JkZnNvdmhianhnaHV3aWp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzAxNzAsImV4cCI6MjEwNzc0NjE3MH0.x00xff1c0ZGy5nHEHswkBrjrwcWokv-nKB_uqqsGiig');

const MANDATORY_TASKS = [
  { key:'fajr', label:'Fajr Prayer', labelAr:'صلاة الفجر', icon:'🕌' },
  { key:'dhuhr', label:'Dhuhr Prayer', labelAr:'صلاة الظهر', icon:'🕌' },

const RANKS = [{ name:'BRONZE', min:0 },{ name:'SILVER', min:300 },{ name:'GOLD', min:800 },{ name:'PLATINUM', min:1800 },{ name:'DIAMOND', min:3000 },{ name:'MASTER', min:5000 }];
const STORE = [
  { id:'freeze', name:'Streak Freeze ❄️', nameAr:'تجميد السلسلة ❄️', price:300, desc:'Protects streak if you miss a day.', descAr:'يحمي السلسلة إذا فوّت يوم.' },
  { id:'title_beast', name:'Title: The Beast 🔥', nameAr:'لقب: الوحش 🔥', price:500, desc:'Shows on leaderboard.', descAr:'يظهر في لوحة الصدارة.' },

const STRINGS = {
  en: {
    tagline:'82-DAY TRANSFORMATION', enterName:'ENTER YOUR NAME', start:'START',
    createTeam:'CREATE A TEAM', joinTeam:'JOIN A TEAM', teamName:'TEAM NAME', inviteCode:'INVITE CODE',

  ar: {

    create:'إنشاء', join:'انضمام', logout:'خروج', loading:'جاري التحميل...', loadingTeam:'جاري تحميل الفريق...', loadingProfile:'جاري تحميل الملف...',
    proofCode:"كود الإثبات اليوم", proofHint:'اكتب هذا في صورك!', grid:'شبكة ٨٢ يوم',
    studyTimer:'📚 مؤقت الدراسة', quranTimer:'📖 مؤقت القرآن', targetReached:'✅ تم الوصول للهدف', 
    minReq:'دقيقة مطلوبة', startBtn:'ابدأ', pauseBtn:'إيقاف', resetBtn:'تصفير',
    mandatory:'غير قابل للتفاوض', extraXp:'نقاط إضافية', addTaskPlaceholder:'أضف مهمتك... (حد أقصى ٨)',
    currentRank:'الرتبة الحالية', buy:'شراء', post:'+ نشر', teamFeed:'منشورات الفريق', user:'مستخدم',
    home:'الرئيسية', store:'المتجر', feed:'المنشورات', ranks:'الترتيب', member:'عضو', xp:'نقطة'
  }
};

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  render() {
    if (this.state.hasError) return <div style={{padding:20,color:'#ff4f4f',background:'#000',height:'100vh'}}><h2>CRASH</h2><pre>{this.state.error.toString()}</pre><button onClick={()=>{localStorage.clear();window.location.reload();}}>RESET</button></div>;
    return this.props.children;
  }
}

function App(){
  const [lang, setLang] = React.useState(()=>localStorage.getItem('lang') || 'en');
  const t = (k) => STRINGS[lang][k] || k;

  const [user, setUser] = React.useState(null);
  const [profile, setProfile] = React.useState(null);
  const [team, setTeam] = React.useState(null);
  const [tasks, setTasks] = React.useState([]);
  const [customTasks, setCustomTasks] = React.useState([]);
  const [history, setHistory] = React.useState([]);
  const [feed, setFeed] = React.useState([]);
  const [leaderboard, setLeaderboard] = React.useState([]);
  const [page, setPage] = React.useState('home');
  const [loading, setLoading] = React.useState(true);
  
  const [nameInput, setNameInput] = React.useState('');
  const [teamName, setTeamName] = React.useState('');
  const [inviteCode, setInviteCode] = React.useState('');
  const [newTaskLabel, setNewTaskLabel] = React.useState('');

  const [studyTime, setStudyTime] = React.useState(0);
  const [studyRunning, setStudyRunning] = React.useState(false);
  const [quranTime, setQuranTime] = React.useState(0);
  const [quranRunning, setQuranRunning] = React.useState(false);

  const today = new Date().toLocaleDateString('en-CA');
  const nonce = React.useMemo(()=>{ let n=localStorage.getItem('nonce-'+today); if(!n){n=Math.random().toString(36).substring(2,6).toUpperCase();localStorage.setItem('nonce-'+today,n);} return n; },[today]);

  React.useEffect(()=>{
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  },[lang]);

  React.useEffect(()=>{ 
    const s=localStorage.getItem('team_user_id'); 
    if(s) setUser(s); 
    else setLoading(false); 
  },[]);

  React.useEffect(()=>{ if(user) loadProfile(); },[user]);
  React.useEffect(()=>{ if(profile?.team_id) loadTeam(profile.team_id); },[profile]);
  React.useEffect(()=>{ if(team){ loadTasks(); loadCustomTasks(); loadHistory(); loadFeed(); loadLeaderboard(); } },[team]);

  React.useEffect(()=>{
    let int;
    if(studyRunning) int = setInterval(()=>setStudyTime(t=>t+1), 1000);
    return ()=>clearInterval(int);
  },[studyRunning]);

  React.useEffect(()=>{
    if(studyTime === 1800 && !tasks.find(t=>t.task_key==='study')?.done) {
      alert(lang==='ar' ? '🔥 وصلت ٣٠ دقيقة! تم إكمال مهمة الدراسة.' : '🔥 30 Minutes Reached! Study task complete.');
      toggleTask('study', true);
    }
  }, [studyTime]);

  React.useEffect(()=>{
    let int;
    if(quranRunning) int = setInterval(()=>setQuranTime(t=>t+1), 1000);
    return ()=>clearInterval(int);
  },[quranRunning]);

  React.useEffect(()=>{
    if(quranTime === 600 && !tasks.find(t=>t.task_key==='quran')?.done) {
      alert(lang==='ar' ? '📖 وصلت ١٠ دقائق! تم إكمال مهمة القرآن.' : '📖 10 Minutes Reached! Quran task complete.');
      toggleTask('quran', true);
    }
  }, [quranTime]);

  async function loadProfile(){ 
    const {data}=await sb.from('profiles').select('*').eq('id',user).maybeSingle(); 
    if(data) {
      setProfile(data);
      if(data.team_id) loadTeam(data.team_id);
    } else {
      localStorage.removeItem('team_user_id');
      setUser(null);
    }
    setLoading(false); 
  }

  async function loadTeam(id){ 
    const {data} = await sb.from('teams').select('*').eq('id',id).maybeSingle(); 
    if(data) setTeam(data);
    else {
      await sb.from('profiles').update({team_id: null}).eq('id', user);
      setProfile(p => ({...p, team_id: null}));
    }
  }

  async function loadTasks(){ const {data}=await sb.from('tasks').select('*').eq('user_id',user).eq('date',today); setTasks(data||[]); }
  async function loadHistory(){ const {data}=await sb.from('tasks').select('date, done, task_key').eq('user_id',user); setHistory(data||[]); }
  async function loadFeed(){ const {data}=await sb.from('feed').select('*').eq('team_id',team.id).order('created_at',{ascending:false}).limit(20); setFeed(data||[]); }
  
  async function loadCustomTasks(){
    const {data}=await sb.from('custom_tasks').select('*').eq('user_id',user);
    if(data && data.length > 0) {
      setCustomTasks(data);
    } else {
      const seedMandatory = MANDATORY_TASKS.map(t => ({key:t.key, label: t.label, user_id:user, active:true, is_mandatory:true}));
      const seedExtras = EXTRA_TASKS.map(t => ({key:t.key, label: t.label, user_id:user, active:true, is_mandatory:false}));
      const {data:s} = await sb.from('custom_tasks').insert([...seedMandatory, ...seedExtras]).select();
      setCustomTasks(s||[]);
    }
  }

  async function loadLeaderboard(){
    const {data:ps}=await sb.from('profiles').select('id, username, xp, title').eq('team_id',team.id);
    const rows=(ps||[]).map(p=>({ user_id:p.id, username:p.username, xp:p.xp||0, title:p.title }));
    rows.sort((a,b)=>b.xp-a.xp); setLeaderboard(rows);
  }

  async function handleAuth(){
    const uname=nameInput.trim(); if(!uname) return;
    const {data:exists}=await sb.from('profiles').select('id').eq('username',uname).maybeSingle();
    if(exists){ localStorage.setItem('team_user_id',exists.id); setUser(exists.id); }
    else {
      const id='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16);});
      await sb.from('profiles').insert({id, username:uname});
      localStorage.setItem('team_user_id',id); setUser(id);
    }
  }

  function handleLogout(){ localStorage.removeItem('team_user_id'); window.location.reload(); }

  async function createTeam(){
    const code=Math.random().toString(36).substring(2,8).toUpperCase();
    const {data}=await sb.from('teams').insert({name:teamName, invite_code:code}).select().single();
    await sb.from('profiles').update({team_id:data.id}).eq('id',user); loadProfile(); setTeam(data);
  }
  async function joinTeam(){
    const {data,error}=await sb.from('teams').select('*').eq('invite_code',inviteCode.toUpperCase()).single();
    if(error) return alert(lang==='ar'?'كود غير صحيح':'Invalid code');
    await sb.from('profiles').update({team_id:data.id}).eq('id',user); loadProfile(); setTeam(data);
  }

  async function toggleTask(key, checked){
    if(key === 'study' && checked && studyTime < 1800) return alert(lang==='ar'?"يجب أن تدرس ٣٠ دقيقة على الأقل!":"You must study for at least 30 minutes!");
    if(key === 'quran' && checked && quranTime < 600) return alert(lang==='ar'?"يجب أن تقرأ القرآن ١٠ دقائق على الأقل!":"You must read Quran for at least 10 minutes!");

    const existing=tasks.find(t=>t.task_key===key);
    if(existing) await sb.from('tasks').update({done:checked}).eq('id',existing.id);
    else await sb.from('tasks').insert({user_id:user, team_id:team.id, date:today, task_key:key, done:checked});
    
    const isMandatory = MANDATORY_TASKS.some(t=>t.key===key);
    let xpChange = checked ? 10 : -10;
    let bonus = 0;

    if(checked && isMandatory) {
      const newDoneTasks = [...tasks.filter(t=>t.done).map(t=>t.task_key), key];
      const allMandatoryDone = MANDATORY_TASKS.every(t => newDoneTasks.includes(t.key));
      if(allMandatoryDone && !existing?.done) {
        bonus = 25;
        alert(lang==='ar'?"🔥 يوم مثالي! +٢٥ نقطة إضافية":"🔥 PERFECT DAY! +25 Bonus XP");
      }
    }

    await sb.from('profiles').update({xp:Math.max(0,(profile.xp||0)+xpChange+bonus)}).eq('id',user);
    setProfile(p=>({...p,xp:Math.max(0,(p.xp||0)+xpChange+bonus)}));
    await loadTasks(); loadHistory(); loadLeaderboard();
  }

  async function addTask() {
    if (!newTaskLabel.trim()) return;
    const extraTasks = customTasks.filter(t => !t.is_mandatory);
    if (extraTasks.length >= 8) return alert(lang==='ar'?"الحد الأقصى ٨ مهام إضافية":"Max 8 custom tasks allowed.");
    
    const key = 'custom_' + Date.now();
    const {data} = await sb.from('custom_tasks').insert({
      user_id: user, key: key, label: newTaskLabel.trim(), icon: '⭐', active: true, is_mandatory: false
    }).select().single();
    
    setCustomTasks([...customTasks, data]);
    setNewTaskLabel('');
  }

  async function deleteTask(id) {
    if(!confirm(lang==='ar'?"حذف هذه المهمة؟":"Delete this task?")) return;
    await sb.from('custom_tasks').delete().eq('id', id);
    setCustomTasks(customTasks.filter(t => t.id !== id));
  }

  function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }

  async function uploadProof(key, file){
    const path=`${team.id}/${user}/${today}/${key}.jpg`;
    await sb.storage.from('proofs').upload(path,file,{upsert:true});
    const {data:{publicUrl}}=sb.storage.from('proofs').getPublicUrl(path);
    const existing=tasks.find(t=>t.task_key===key);
    if(existing) await sb.from('tasks').update({proof_url:publicUrl,done:true}).eq('id',existing.id);
    else await sb.from('tasks').insert({user_id:user, team_id:team.id, date:today, task_key:key, proof_url:publicUrl, done:true});
    loadTasks(); loadHistory();
  }

  async function buyItem(item){
    if((profile.xp||0) < item.price) return alert(lang==='ar'?'نقاطك غير كافية!':'Not enough XP!');
    const newInv=[...(profile.inventory||[]), item.id];
    await sb.from('profiles').update({xp:profile.xp-item.price, inventory:newInv}).eq('id',user);
    setProfile(p=>({...p,xp:p.xp-item.price, inventory:newInv}));
    alert(lang==='ar'?`تم شراء ${item.nameAr}!`:`Purchased ${item.name}!`);
  }

  async function sendNudge(){
    const msg = prompt(lang==='ar'?"اكتب رسالة للفريق:":"Enter a message to your team:");
    if(!msg) return;
    await sb.from('feed').insert({team_id:team.id, user_id:user, message:msg});
    loadFeed();
  }

  const mandatoryKeys = MANDATORY_TASKS.map(t=>t.key);
  const doneMandatoryByDate = {};
  history.forEach(h => {
    if(h.done && mandatoryKeys.includes(h.task_key)) {
      doneMandatoryByDate[h.date] = (doneMandatoryByDate[h.date] || 0) + 1;
    }
  });
  
  const completeDates = new Set();
  Object.entries(doneMandatoryByDate).forEach(([date,count])=>{
    if(count === mandatoryKeys.length) completeDates.add(date);
  });

  let streak=0; let d=new Date();
  while(true){ 
    const ds=d.toLocaleDateString('en-CA'); 
    if(completeDates.has(ds)){ streak++; d.setDate(d.getDate()-1); } 
    else { if(streak===0 && ds===today){ d.setDate(d.getDate()-1); } else break; } 
  }

  const langBtn = <button className="lang-btn" onClick={()=>setLang(lang==='en'?'ar':'en')}>🌐 {lang==='en'?'العربية':'English'}</button>;

  if(loading) return <div className="container" style={{textAlign:'center',marginTop:50,color:'#7CFF4F'}}>{t('loading')}</div>;

  if(!user) return (
    <div className="container" style={{marginTop:80}}>
      <div className="header" style={{justifyContent:'flex-end'}}>{langBtn}</div>
      <h1>TEAM <span>1%</span></h1><p style={{color:'#666',fontSize:12,marginBottom:30}}>{t('tagline')}</p>
      <input placeholder={t('enterName')} value={nameInput} onChange={e=>setNameInput(e.target.value)}/>
      <button className="primary" onClick={handleAuth} style={{width:'100%'}}>{t('start')}</button>
    </div>
  );

  if(!profile) return <div className="container">{t('loadingProfile')}</div>;

  if(!profile.team_id) return (
    <div className="container" style={{marginTop:50}}>
      <div className="header" style={{justifyContent:'flex-end'}}>{langBtn}</div>
      <h1>{t('joinTeam')}</h1>
      <input placeholder={t('teamName')} value={teamName} onChange={e=>setTeamName(e.target.value)}/>
      <button className="primary" onClick={createTeam} style={{width:'100%'}}>{t('create')}</button>
      <h2 style={{marginTop:30}}>OR</h2>
      <input placeholder={t('inviteCode')} value={inviteCode} onChange={e=>setInviteCode(e.target.value)}/>
      <button className="primary" onClick={joinTeam} style={{width:'100%'}}>{t('join')}</button>
      <button onClick={handleLogout} style={{marginTop:30,background:'none',color:'#ff4f4f'}}>{t('logout')}</button>
    </div>
  );

  if(!team) return <div className="container" style={{textAlign:'center',marginTop:50,color:'#7CFF4F'}}>{t('loadingTeam')}</div>;

  const rank = RANKS.slice().reverse().find(r => (profile.xp||0) >= r.min) || RANKS[0];
  const nextRank = RANKS.find(r => (profile.xp||0) < r.min);
  const progress = nextRank ? (((profile.xp||0)-rank.min)/(nextRank.min-rank.min))*100 : 100;
  
  const mandatoryDoneCount = tasks.filter(t => t.done && mandatoryKeys.includes(t.task_key)).length;
  const extraTasks = customTasks.filter(t => !t.is_mandatory && t.active);

  return (
    <div className="container">
      <div className="header">
        <h1>TEAM <span>1%</span></h1>
        <div className="header-actions">
          {langBtn}
          <div className="streak">🔥 {streak}</div>
        </div>
      </div>

      {page === 'home' && (
        <>
          <div style={{background:'#111', padding:'12px', borderRadius:'8px', marginBottom:'15px', border:'1px solid #333', textAlign:'center'}}>
  <div style={{fontSize:'12px', color:'#888', fontWeight:'bold'}}>TEAM INVITE CODE</div>
  <div style={{fontSize:'28px', fontWeight:'900', color:'#7CFF4F', letterSpacing:'4px', margin:'5px 0'}}>{team.invite_code}</div>
  <div style={{fontSize:'11px', color:'#666'}}>Share this code with your friends to let them join!</div>
</div>
          <div className="nonce">
            <div style={{fontSize:10,color:'#888',marginBottom:5}}>{t('proofCode')}</div>
            <div className="nonce-code">{nonce}</div>
            <div style={{fontSize:10,color:'#7CFF4F',marginTop:5}}>{t('proofHint')}</div>
          </div>

          <h2>{t('grid')}</h2>
          <div className="grid">
            {Array.from({length:82}).map((_,i)=>{
              const d = new Date(team.created_at || Date.now()); d.setDate(d.getDate() + i);
              const ds = d.toLocaleDateString('en-CA');
              const isDone = completeDates.has(ds);
              return <div key={i} className={`box ${isDone?'done':''}`} title={ds}></div>
            })}
          </div>

          <div className="timer-box">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:12,color:'#888',fontWeight:'bold'}}>{t('studyTimer')}</div>
              <div style={{fontSize:10,color:studyTime>=1800?'#7CFF4F':'#ff4f4f'}}>
                {studyTime>=1800 ? t('targetReached') : '30 ' + t('minReq')}
              </div>
            </div>
            <div className="timer-val">
              {formatTime(studyTime)}
            </div>
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setStudyRunning(!studyRunning)} style={{flex:2,background:studyRunning?'#ff4f4f':'#7CFF4F',color:studyRunning?'#fff':'#000'}}>
                {studyRunning?t('pauseBtn'):t('startBtn')}
              </button>
              <button onClick={()=>{setStudyRunning(false); setStudyTime(0);}} style={{flex:1}}>{t('resetBtn')}</button>
            </div>
          </div>

          <div className="timer-box">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:12,color:'#888',fontWeight:'bold'}}>{t('quranTimer')}</div>
              <div style={{fontSize:10,color:quranTime>=600?'#7CFF4F':'#ff4f4f'}}>
                {quranTime>=600 ? t('targetReached') : '10 ' + t('minReq')}
              </div>
            </div>
            <div className="timer-val">
              {formatTime(quranTime)}
            </div>
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setQuranRunning(!quranRunning)} style={{flex:2,background:quranRunning?'#ff4f4f':'#7CFF4F',color:quranRunning?'#fff':'#000'}}>
                {quranRunning?t('pauseBtn'):t('startBtn')}
              </button>
              <button onClick={()=>{setQuranRunning(false); setQuranTime(0);}} style={{flex:1}}>{t('resetBtn')}</button>
            </div>
          </div>

          <h2 style={{color:'#ff4f4f'}}>{t('mandatory')} ({mandatoryDoneCount}/{MANDATORY_TASKS.length})</h2>
          {MANDATORY_TASKS.map(task=>{
            const isDone = tasks.find(x=>x.task_key===task.key)?.done;
            const label = lang==='ar' ? task.labelAr : task.label;
            return (
              <div className={`task ${isDone?'done':''}`} key={task.key}>
                <span className="icon">{task.icon}</span><span className="label">{label}</span>
                <label className="upload-btn">📷 <input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>{if(e.target.files[0]) uploadProof(task.key,e.target.files[0])}}/></label>
                <input type="checkbox" checked={isDone||false} onChange={e=>toggleTask(task.key,e.target.checked)} style={{width:20,height:20,accentColor:'#7CFF4F'}}/>
              </div>
            );
          })}

          <h2 style={{color:'#888'}}>{t('extraXp')}</h2>
          {extraTasks.map(task=>{
            const isDone = tasks.find(x=>x.task_key===task.key)?.done;
            
            // Translate default extras if they match the keys, otherwise use custom label
            let label = task.label;
            if (lang==='ar') {
              const found = EXTRA_TASKS.find(x=>x.key===task.key);
              if (found) label = found.labelAr;
            }

            return (
              <div className={`task ${isDone?'done':''}`} key={task.key}>
                <span className="icon">{task.icon}</span><span className="label">{label}</span>
                <label className="upload-btn">📷 <input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>{if(e.target.files[0]) uploadProof(task.key,e.target.files[0])}}/></label>
                <input type="checkbox" checked={isDone||false} onChange={e=>toggleTask(task.key,e.target.checked)} style={{width:20,height:20,accentColor:'#7CFF4F'}}/>
                {task.key.startsWith('custom_') && (
                  <button className="delete-btn" onClick={()=>deleteTask(task.id)}>✕</button>
                )}
              </div>
            );
          })}

          {extraTasks.length < 8 && (
            <div className="add-task">
              <input placeholder={t('addTaskPlaceholder')} value={newTaskLabel} onChange={e=>setNewTaskLabel(e.target.value)} />
              <button onClick={addTask}>+</button>
            </div>
          )}
        </>
      )}

      {page === 'store' && (
        <>
          <div className="rank-card">
            <div style={{fontSize:10,color:'#888'}}>{t('currentRank')}</div>
            <div style={{fontSize:20,fontWeight:'bold'}}>{rank.name} • {(profile.xp||0)} {t('xp')}</div>
            <div className="xp-bar"><div className="xp-bar-fill" style={{width:progress+'%'}}/></div>
          </div>
          <h2>{t('store')}</h2>
          {STORE.map(item=>(
            <div className="card" key={item.id}>
              <div style={{fontWeight:'bold',color:'#7CFF4F'}}>{lang==='ar'?item.nameAr:item.name}</div>
              <div style={{fontSize:12,color:'#888',margin:'5px 0'}}>{lang==='ar'?item.descAr:item.desc}</div>
              <button onClick={()=>buyItem(item)} disabled={(profile.xp||0)<item.price} style={{width:'100%',marginTop:10}}>{t('buy')} {item.price} {t('xp')}</button>
            </div>
          ))}
        </>
      )}

      {page === 'feed' && (
        <>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:15}}>
            <h2 style={{margin:0}}>{t('teamFeed')}</h2>
            <button onClick={sendNudge} style={{background:'#7CFF4F',color:'#000',padding:'5px 10px',fontSize:12}}>{t('post')}</button>
          </div>
          {feed.map(f=>(
            <div className="card" key={f.id}>
              <div style={{fontSize:11,color:'#7CFF4F',marginBottom:5}}>{t('user')}</div>
              <div>{f.message}</div>
            </div>
          ))}
        </>
      )}

      {page === 'ranks' && (
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr><th style={{textAlign:lang==='ar'?'right':'left',color:'#888',fontSize:10}}>#</th><th style={{textAlign:lang==='ar'?'right':'left',color:'#888',fontSize:10}}>{t('member')}</th><th style={{textAlign:lang==='ar'?'left':'right',color:'#888',fontSize:10}}>{t('xp')}</th></tr></thead>
          <tbody>
            {leaderboard.map((r,i)=>(
              <tr key={r.user_id} style={{borderBottom:'1px solid #222'}}>
                <td style={{padding:15}}>{i+1}</td>
                <td style={{padding:15,fontWeight:r.user_id===user?'bold':'normal',color:r.user_id===user?'#7CFF4F':'#fff'}}>{r.username}<br/><span style={{fontSize:10,color:'#888'}}>{r.title||'Rookie'}</span></td>
                <td style={{padding:15,textAlign:lang==='ar'?'left':'right'}}>{r.xp}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <nav>
        <button className={page==='home'?'active':''} onClick={()=>setPage('home')}><span>🏠</span>{t('home')}</button>
        <button className={page==='store'?'active':''} onClick={()=>setPage('store')}><span>🛒</span>{t('store')}</button>
        <button className={page==='feed'?'active':''} onClick={()=>setPage('feed')}><span>💬</span>{t('feed')}</button>
        <button className={page==='ranks'?'active':''} onClick={()=>setPage('ranks')}><span>🏆</span>{t('ranks')}</button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
