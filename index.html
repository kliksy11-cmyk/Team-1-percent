*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#000;color:#fff;min-height:100vh;}
.container{max-width:500px;margin:0 auto;padding:20px;padding-bottom:100px;}

input:focus,select:focus{border-color:#7CFF4F;}
button{padding:14px;border:none;border-radius:8px;background:#111;color:#fff;font-size:14px;cursor:pointer;font-weight:bold;border:1px solid #222;}
button.primary{background:#7CFF4F;color:#000;border:none;box-shadow:0 0 10px rgba(124,255,79,0.2);}
button:disabled{opacity:0.5;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.header-actions{display:flex;align-items:center;gap:5px;}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#222;border:2px solid #333;cursor:pointer;}
.avatar-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#222;border:1px solid #444;margin-right:8px;vertical-align:middle;}
.lang-btn{background:#111;color:#fff;border:1px solid #333;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:bold;}
.leave-btn{background:#ff4f4f22;color:#ff4f4f;border:1px solid #ff4f4f;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:bold;}
.logout-btn{background:#333;color:#fff;border:1px solid #555;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:bold;}
.streak{background:#7CFF4F22;color:#7CFF4F;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:14px;border:1px solid #7CFF4F;}
.coins{background:#fbbf2422;color:#fbbf24;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:14px;border:1px solid #fbbf24;}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:20px;}
.box{aspect-ratio:1;background:#111;border-radius:3px;border:1px solid #222;}
.box.done{background:#7CFF4F;border-color:#7CFF4F;box-shadow:0 0 5px #7CFF4F;}
.box.freeze{background:#3b82f6;border-color:#60a5fa;box-shadow:0 0 5px #3b82f6;}
.task{display:flex;align-items:center;gap:10px;padding:14px;background:#0a0a0a;border-radius:8px;margin-bottom:10px;border:1px solid #222;}
.task.done{border-color:#7CFF4F;background:#7CFF4F11;}
.task .icon{font-size:20px;}
.task .label{flex:1;font-weight:600;font-size:14px;}
.upload-btn{background:#111;padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #333;}
.timer-box{background:#0a0a0a;padding:15px;border-radius:10px;margin-bottom:15px;border:1px dashed #7CFF4F;}
.timer-val{font-family:monospace;font-size:36px;color:#7CFF4F;font-weight:bold;text-align:center;margin:15px 0;letter-spacing:2px;}
.card{background:#0a0a0a;padding:15px;border-radius:8px;margin-bottom:10px;border:1px solid #222;}
.rank-card{background:#0a0a0a;padding:20px;border-radius:12px;border:1px solid #222;border-left:4px solid #7CFF4F;margin-bottom:20px;}
.xp-bar{height:6px;background:#111;border-radius:3px;margin-top:10px;overflow:hidden;}
.xp-bar-fill{height:100%;background:#7CFF4F;transition:0.3s;}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0;z-index:10;}
nav button{background:none;color:#666;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;width:auto;padding:0;}
nav button.active{color:#7CFF4F;}
nav button span{font-size:22px;}
.add-task{display:flex;gap:5px;margin-top:10px;}
.add-task input{margin-bottom:0;flex:1;}
.add-task button{width:auto;padding:0 15px;background:#7CFF4F;color:#000;}
.delete-btn{background:none;border:none;color:#ff4f4f;font-size:16px;padding:0 5px;cursor:pointer;}
.invite-box{background:#111; padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid #333; text-align:center;}
.goal-card{background:#111; padding:15px; border-radius:8px; margin-bottom:10px; border-left:3px solid #7CFF4F;}
.notify-btn{background:#1e293b; color:#7CFF4F; border:1px solid #7CFF4F; padding:6px 10px; border-radius:20px; font-size:12px; cursor:pointer; font-weight:bold; margin-bottom:10px;}
.proof-card{background:#111; border-radius:8px; overflow:hidden; margin-bottom:15px; border:1px solid #333;}
.proof-img{width:100%; height:auto; max-height:300px; object-fit:cover; display:block;}
.proof-info{padding:10px; display:flex; justify-content:space-between; align-items:center;}
.freeze-alert{background:#3b82f622; border:1px solid #3b82f6; padding:12px; border-radius:8px; margin-bottom:15px; text-align:center; font-size:13px;}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  render() {
    if (this.state.hasError) return <div style={{padding:20,color:'#ff4f4f',background:'#000',height:'100vh'}}><h2>CRASH</h2><pre>{this.state.error.toString()}</pre><button onClick={()=>{localStorage.clear();window.location.reload();}}>RESET</button></div>;
    return this.props.children;
  }
}

  const [user, setUser] = React.useState(null);
  const [profile, setProfile] = React.useState(null);
  const [team, setTeam] = React.useState(null);

  const [customTasks, setCustomTasks] = React.useState([]);
  const [goals, setGoals] = React.useState([]);
  const [history, setHistory] = React.useState([]);
  const [feed, setFeed] = React.useState([]);
  const [teamProofs, setTeamProofs] = React.useState([]);
  const [leaderboard, setLeaderboard] = React.useState([]);
  
  const [page, setPage] = React.useState('home');
  const [loading, setLoading] = React.useState(true);
  const [isOnboarding, setIsOnboarding] = React.useState(false);
  const [notifEnabled, setNotifEnabled] = React.useState(localStorage.getItem('notifEnabled') === 'true');

  const [nameInput, setNameInput] = React.useState('');
  const [passInput, setPassInput] = React.useState('');
  const [teamName, setTeamName] = React.useState('');
  const [inviteCode, setInviteCode] = React.useState('');
  const [newTaskLabel, setNewTaskLabel] = React.useState('');
  const [newGoalLabel, setNewGoalLabel] = React.useState('');

  const [setupPassUser, setSetupPassUser] = React.useState(null);
  const [newPassSetup, setNewPassSetup] = React.useState('');

  const [studyTime, setStudyTime] = React.useState(0);
  const [studyRunning, setStudyRunning] = React.useState(false);
  const [studyStartTime, setStudyStartTime] = React.useState(null);

  const [quranTime, setQuranTime] = React.useState(0);
  const [quranRunning, setQuranRunning] = React.useState(false);
  const [quranStartTime, setQuranStartTime] = React.useState(null);

  const today = new Date().toLocaleDateString('en-CA');
  const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-CA');

  React.useEffect(()=>{
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  },[lang]);

  React.useEffect(()=>{ 
    const s=localStorage.getItem('team_user_id'); 
    if(s) setUser(s); 
    else setLoading(false); 
  },[]);

  React.useEffect(()=>{ if(user) loadProfile(); },[user]);
  React.useEffect(()=>{ if(profile?.team_id) loadTeam(profile.team_id); },[profile]);
  React.useEffect(()=>{ if(team){ loadTasks(); loadCustomTasks(); loadGoals(); loadHistory(); loadFeed(); loadTeamProofs(); loadLeaderboard(); } },[team]);
  React.useEffect(()=>{ 
    if(page==='ranks') loadLeaderboard(); 
    if(page==='feed') { loadFeed(); loadTeamProofs(); }
  }, [page]);

  // NOTIFICATION TIMER
  React.useEffect(() => {
    let interval;
    if (notifEnabled && team) {
      interval = setInterval(() => {
        const doneCount = tasks.filter(t => t.done && MANDATORY_TASKS.some(m => m.key === t.task_key)).length;
        if (doneCount < MANDATORY_TASKS.length) {
          if (Notification.permission === 'granted') {
            new Notification(t('notifTitle'), { body: t('notifBody'), icon: '/icon.png' });
          }
        }
      }, 60 * 60 * 1000);
    }
    return () => clearInterval(interval);
  }, [notifEnabled, tasks, team, lang]);

  async function enableNotifications() {
    if (!("Notification" in window)) return alert("This browser does not support notifications.");
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      setNotifEnabled(true);
      localStorage.setItem('notifEnabled', 'true');
      new Notification(t('notifTitle'), { body: t('notifBody') });
    } else {
      alert("Notifications blocked. Please enable them in your browser settings.");
    }
  }

  React.useEffect(() => {
    const sDate = localStorage.getItem('studyDate');
    if (sDate === today) {
      const accum = parseInt(localStorage.getItem('studyAccum') || '0');
      const start = localStorage.getItem('studyStart');
      if (start) {
        setStudyTime(accum + Math.floor((Date.now() - parseInt(start)) / 1000));
        setStudyRunning(true);
        setStudyStartTime(parseInt(start));
      } else {
        setStudyTime(accum);
      }
    } else {
      localStorage.setItem('studyDate', today);
      localStorage.setItem('studyAccum', '0');
      localStorage.removeItem('studyStart');
    }
    
    const qDate = localStorage.getItem('quranDate');
    if (qDate === today) {
      const accum = parseInt(localStorage.getItem('quranAccum') || '0');
      const start = localStorage.getItem('quranStart');
      if (start) {
        setQuranTime(accum + Math.floor((Date.now() - parseInt(start)) / 1000));
        setQuranRunning(true);
        setQuranStartTime(parseInt(start));
      } else {
        setQuranTime(accum);
      }
    } else {
      localStorage.setItem('quranDate', today);
      localStorage.setItem('quranAccum', '0');
      localStorage.removeItem('quranStart');
    }
  }, []);

  React.useEffect(() => {
    const handleVis = () => {
      if (document.visibilityState === 'visible') {
        if (studyRunning && studyStartTime) {
          const accum = parseInt(localStorage.getItem('studyAccum') || '0');
          setStudyTime(accum + Math.floor((Date.now() - studyStartTime) / 1000));
        }
        if (quranRunning && quranStartTime) {
          const accum = parseInt(localStorage.getItem('quranAccum') || '0');
          setQuranTime(accum + Math.floor((Date.now() - quranStartTime) / 1000));
        }
      }
    };
    document.addEventListener('visibilitychange', handleVis);
    return () => document.removeEventListener('visibilitychange', handleVis);
  }, [studyRunning, studyStartTime, quranRunning, quranStartTime]);

  React.useEffect(()=>{
    let int;
    if(studyRunning) int = setInterval(()=> {
      const accum = parseInt(localStorage.getItem('studyAccum') || '0');
      setStudyTime(accum + Math.floor((Date.now() - studyStartTime) / 1000));
    }, 1000);
    return ()=>clearInterval(int);
  },[studyRunning, studyStartTime]);

  React.useEffect(()=>{
    let int;
    if(quranRunning) int = setInterval(()=> {
      const accum = parseInt(localStorage.getItem('quranAccum') || '0');
      setQuranTime(accum + Math.floor((Date.now() - quranStartTime) / 1000));
    }, 1000);
    return ()=>clearInterval(int);
  },[quranRunning, quranStartTime]);

  React.useEffect(()=>{
    if(studyTime >= 1800 && studyRunning && !tasks.find(t=>t.task_key==='study')?.done) {
      pauseStudy();
      alert(lang==='ar' ? '🔥 وصلت ٣٠ دقيقة! تم إكمال مهمة الدراسة.' : '🔥 30 Minutes Reached! Study task complete.');
      toggleTask('study', true);
    }
  }, [studyTime, studyRunning]);

  React.useEffect(()=>{
    if(quranTime >= 600 && quranRunning && !tasks.find(t=>t.task_key==='quran')?.done) {
      pauseQuran();
      alert(lang==='ar' ? '📖 وصلت ١٠ دقائق! تم إكمال مهمة القرآن.' : '📖 10 Minutes Reached! Quran task complete.');
      toggleTask('quran', true);
    }
  }, [quranTime, quranRunning]);

  async function loadProfile(){ 
    const {data}=await sb.from('profiles').select('*').eq('id',user).maybeSingle(); 
    if(data) {
      setProfile(data);
      if(data.team_id) loadTeam(data.team_id);
    } else {
      localStorage.removeItem('team_user_id');
      setUser(null);
    }
    setLoading(false); 
  }

  async function loadTeam(id){ 
    const {data} = await sb.from('teams').select('*').eq('id',id).maybeSingle(); 
    if(data) setTeam(data);
    else {
      await sb.from('profiles').update({team_id: null}).eq('id', user);
      setProfile(p => ({...p, team_id: null}));
    }
  }

  async function toggleTask(key, checked){
    if(key === 'study' && checked && studyTime < 1800) return alert(lang==='ar'?"يجب أن تدرس ٣٠ دقيقة على الأقل!":"You must study for at least 30 minutes!");
    if(key === 'quran' && checked && quranTime < 600) return alert(lang==='ar'?"يجب أن تقرأ القرآن ١٠ دقائق على الأقل!":"You must read Quran for at least 10 minutes!");

    const existing=tasks.find(t=>t.task_key===key);
    if(existing) await sb.from('tasks').update({done:checked}).eq('id',existing.id);
    else await sb.from('tasks').insert({user_id:user, team_id:team.id, date:today, task_key:key, done:checked});
    
    const isMandatory = MANDATORY_TASKS.some(t=>t.key===key);
    let xpChange = 10;

    if (key.startsWith('custom_')) {
      const userCustoms = customTasks.filter(t => !t.is_mandatory);
      const taskIndex = userCustoms.findIndex(t => t.key === key);
      if (taskIndex >= 8) xpChange = 2;
    }
    if (!checked) xpChange = -xpChange;

    let bonus = 0;
    if(checked && isMandatory) {
      const newDoneTasks = [...tasks.filter(t=>t.done).map(t=>t.task_key), key];
      const allMandatoryDone = MANDATORY_TASKS.every(t => newDoneTasks.includes(t.key));
      if(allMandatoryDone && !existing?.done) {
        bonus = 25;
        alert(lang==='ar'?"🔥 يوم مثالي! +٢٥ نقطة وعملة إضافية":"🔥 PERFECT DAY! +25 Bonus XP & Coins");
      }
    }

    // Award BOTH XP and Coins
    const newXp = Math.max(0, (profile.xp||0) + xpChange + bonus);
    const newCoins = Math.max(0, (profile.coins||0) + xpChange + bonus);

    await sb.from('profiles').update({xp: newXp, coins: newCoins}).eq('id',user);
    setProfile(p=>({...p, xp: newXp, coins: newCoins}));
    await loadTasks(); loadHistory(); loadLeaderboard();
  }

  function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }

    // Check COINS instead of XP
    if((profile.coins||0) < item.price) return alert(t('notEnoughCoins'));
    const newInv=[...(profile.inventory||[]), item.id];
    const updates = {coins: profile.coins-item.price, inventory: newInv};
    
    if(item.id === 'title_beast') updates.title = 'The Beast 🔥';

    await sb.from('profiles').update(updates).eq('id',user);

  // --- STORE LOGIC: Use Freeze & Skip ---
  async function useItem(itemId, targetDate) {
    const inv = [...(profile.inventory||[])];
    const idx = inv.indexOf(itemId);
    if(idx === -1) return alert(t('notEnoughItems'));
    
    inv.splice(idx, 1); // Remove 1 item
    await sb.from('profiles').update({inventory: inv}).eq('id', user);
    
    // Create a fake task record so the streak logic counts it
    await sb.from('tasks').insert({user_id:user, team_id:team.id, date:targetDate, task_key:itemId, done:true});
    
    setProfile(p => ({...p, inventory: inv}));
    loadHistory(); loadTasks();
    alert(itemId === 'freeze' ? t('freezeApplied') : t('skipApplied'));
  }

            </div>
          </div>

          <h2 style={{color:'#ff4f4f'}}>{t('mandatory')} ({mandatoryDoneCount}/{MANDATORY_TASKS.length})</h2>
          {MANDATORY_TASKS.map(task=>{
            const taskData = tasks.find(x=>x.task_key===task.key); 
            const isDone = taskData?.done;
            const label = lang==='ar' ? task.labelAr : task.label;
            return (
              <div className={`task ${isDone?'done':''}`} key={task.key}>
                <span className="icon">{task.icon}</span><span className="label">{label}</span>
                {taskData?.proof_url && (
                  <a href={taskData.proof_url} target="_blank" rel="noreferrer" style={{color:'#7CFF4F', fontSize:12, textDecoration:'underline', marginRight:5}}>View</a>
                )}
                <label className="upload-btn">📷 <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{if(e.target.files[0]) uploadProof(task.key,e.target.files[0])}}/></label>
                <input type="checkbox" checked={isDone||false} onChange={e=>toggleTask(task.key,e.target.checked)} style={{width:20,height:20,accentColor:'#7CFF4F'}}/>
              </div>
            );
          })}

          <h2 style={{color:'#888'}}>{t('extraXp')}</h2>
          {extraTasks.map(task=>{
            const taskData = tasks.find(x=>x.task_key===task.key); 
            const isDone = taskData?.done;
            let label = task.label;
            if (lang==='ar') {
              const found = EXTRA_TASKS.find(x=>x.key===task.key);
              if (found) label = found.labelAr;
            }
            const index = extraTasks.findIndex(t => t.key === task.key);
            const reward = index < 8 ? 10 : 2;

            return (
              <div className={`task ${isDone?'done':''}`} key={task.key}>
                <span className="icon">{task.icon}</span>
                <span className="label">{label} <span style={{fontSize:10, color:'#7CFF4F'}}>(+{reward})</span></span>
                {taskData?.proof_url && (
                  <a href={taskData.proof_url} target="_blank" rel="noreferrer" style={{color:'#7CFF4F', fontSize:12, textDecoration:'underline', marginRight:5}}>View</a>
                )}
                <label className="upload-btn">📷 <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{if(e.target.files[0]) uploadProof(task.key,e.target.files[0])}}/></label>
                <input type="checkbox" checked={isDone||false} onChange={e=>toggleTask(task.key,e.target.checked)} style={{width:20,height:20,accentColor:'#7CFF4F'}}/>
                {task.key.startsWith('custom_') && (
                  <button className="delete-btn" onClick={()=>deleteTask(task.id)}>✕</button>
                )}
              </div>
            );
          })}

          <div className="add-task">
            <input placeholder={t('addTaskPlaceholder')} value={newTaskLabel} onChange={e=>setNewTaskLabel(e.target.value)} />
            <button onClick={addTask}>+</button>
          </div>
        </>
      )}

      {page === 'goals' && (
        <>
          <h2 style={{color:'#7CFF4F', textAlign:'center'}}>{t('myGoals')}</h2>
          {goals.length === 0 && <p style={{textAlign:'center',color:'#888'}}>{t('noGoals')}</p>}
          
          {goals.map(g => (
            <div key={g.id} className="goal-card" style={{borderLeftColor: g.status === 'done' ? '#7CFF4F' : '#ff4f4f'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10}}>
                <span style={{fontSize:15, fontWeight:'bold', textDecoration: g.status === 'done' ? 'line-through' : 'none', color: g.status === 'done' ? '#888' : '#fff'}}>
                  {g.title}
                </span>
                <button className="delete-btn" onClick={()=>deleteGoal(g.id)}>✕</button>
              </div>
              {g.status !== 'done' && (
                <button onClick={()=>completeGoal(g.id)} style={{marginTop:10, background:'#7CFF4F', color:'#000', padding:'6px 12px', fontSize:12, border:'none'}}>
                  {t('markDone')}
                </button>
              )}
            </div>
          ))}

          <div className="add-task" style={{marginTop:20}}>
            <input placeholder={t('goalPlaceholder')} value={newGoalLabel} onChange={e=>setNewGoalLabel(e.target.value)} />
            <button onClick={addGoal}>+</button>
          </div>
        </>
      )}

      {page === 'store' && (
        <>
          <div className="rank-card">
            <div style={{fontSize:10,color:'#888'}}>{t('currentRank')}</div>
            <div style={{fontSize:20,fontWeight:'bold'}}>{rank.name} • {(profile.xp||0)} {t('xp')}</div>
            <div className="xp-bar"><div className="xp-bar-fill" style={{width:progress+'%'}}/></div>
            <div style={{marginTop:15, fontSize:16, fontWeight:'bold', color:'#fbbf24'}}>🪙 {profile.coins||0} {t('coins')}</div>
          </div>
          <h2>{t('store')}</h2>
          {STORE.map(item=>(
            <div className="card" key={item.id}>
              <div style={{fontWeight:'bold',color:'#7CFF4F'}}>{lang==='ar'?item.nameAr:item.name}</div>
              <div style={{fontSize:12,color:'#888',margin:'5px 0'}}>{lang==='ar'?item.descAr:item.desc}</div>
              <button onClick={()=>buyItem(item)} disabled={(profile.coins||0)<item.price} style={{width:'100%',marginTop:10}}>
                {t('buy')} {item.price} 🪙 {t('coins')}
              </button>
            </div>
          ))}
        </>
      )}

      {page === 'feed' && (
        <>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:15}}>
            <h2 style={{margin:0}}>{t('teamChat')}</h2>
            <button onClick={sendNudge} style={{background:'#7CFF4F',color:'#000',padding:'5px 10px',fontSize:12}}>{t('post')}</button>
          </div>
          {feed.map(f=>(
            <div className="card" key={f.id}>
              <div style={{display:'flex', alignItems:'center', marginBottom:5}}>
                <img src={f.profiles?.avatar_url || 'https://api.dicebear.com/7.x/bottts/svg?seed='+(f.profiles?.username||'User')} className="avatar-sm" alt="avatar" />
                <span style={{fontSize:11,color:'#7CFF4F', fontWeight:'bold'}}>{f.profiles?.username || 'User'}</span>
              </div>
              <div>{f.message}</div>
            </div>
          ))}

          <h2 style={{marginTop:30}}>{t('teamProofs')}</h2>
          {teamProofs.length === 0 && <p style={{textAlign:'center',color:'#888'}}>{t('noProofs')}</p>}
          {teamProofs.map(p => {
            let taskLabel = p.task_key;
            const mTask = MANDATORY_TASKS.find(m => m.key === p.task_key);
            if (mTask) taskLabel = lang==='ar' ? mTask.labelAr : mTask.label;
            else {
              const eTask = EXTRA_TASKS.find(e => e.key === p.task_key);
              if (eTask) taskLabel = lang==='ar' ? eTask.labelAr : eTask.label;
              else taskLabel = p.task_key.replace('custom_', 'Custom Task ');
            }

            return (
              <div className="proof-card" key={p.id}>
                <img src={p.proof_url} alt="Proof" className="proof-img" onClick={()=>window.open(p.proof_url, '_blank')} />
                <div className="proof-info">
                  <div style={{display:'flex', alignItems:'center'}}>
                    <img src={p.profiles?.avatar_url || 'https://api.dicebear.com/7.x/bottts/svg?seed='+(p.profiles?.username||'User')} className="avatar-sm" alt="avatar" />
                    <div>
                      <div style={{fontWeight:'bold', color:'#fff'}}>{p.profiles?.username || 'User'}</div>
                      <div style={{fontSize:11, color:'#888'}}>{taskLabel}</div>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </>
      )}

      {page === 'ranks' && (
        <>
          <h2 style={{textAlign:'center', color:'#7CFF4F'}}>{t('globalRanks')}</h2>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr><th style={{textAlign:lang==='ar'?'right':'left',color:'#888',fontSize:10}}>#</th><th style={{textAlign:lang==='ar'?'right':'left',color:'#888',fontSize:10}}>{t('member')}</th><th style={{textAlign:lang==='ar'?'left':'right',color:'#888',fontSize:10}}>{t('xp')}</th></tr></thead>
            <tbody>
              {leaderboard.map((r,i)=>(
                <tr key={r.user_id} style={{borderBottom:'1px solid #222'}}>
                  <td style={{padding:15}}>{i+1}</td>
                  <td style={{padding:15,fontWeight:r.user_id===user?'bold':'normal',color:r.user_id===user?'#7CFF4F':'#fff'}}>
                    <div style={{display:'flex', alignItems:'center'}}>
                      <img src={r.avatar_url || 'https://api.dicebear.com/7.x/bottts/svg?seed='+r.username} className="avatar-sm" alt="avatar" />
                      <div>
                        {r.username}
                        <br/>
                        <span style={{fontSize:10,color:'#888'}}>{r.team_name} • {r.title||'Rookie'}</span>
                      </div>
                    </div>
                  </td>
                  <td style={{padding:15,textAlign:lang==='ar'?'left':'right'}}>{r.xp}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </>
      )}

      <nav>
        <button className={page==='home'?'active':''} onClick={()=>setPage('home')}><span>🏠</span>{t('home')}</button>
        <button className={page==='goals'?'active':''} onClick={()=>setPage('goals')}><span>🎯</span>{t('goalsTab')}</button>
        <button className={page==='store'?'active':''} onClick={()=>setPage('store')}><span>🛒</span>{t('store')}</button>
        <button className={page==='feed'?'active':''} onClick={()=>setPage('feed')}><span>💬</span>{t('feed')}</button>
        <button className={page==='ranks'?'active':''} onClick={()=>setPage('ranks')}><span>🏆</span>{t('ranks')}</button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
