  // AI Coach Logic: Generate Tasks
  async function sendAIMessage(e) {
    e.preventDefault();
    if(!chatInput.trim()) return;
    const userText = chatInput;
    const newMsgs = [...chatMessages, {role: 'user', text: userText}];
    setChatMessages(newMsgs);setChatInput('');setIsTyping(true);

    try {
      const systemPrompt = `You are an expert Islamic life coach for a self-improvement app called TEAM 1%. 
      The user will describe their goals (e.g., health, studies, deen, business). 
      You must generate a perfectly balanced list of daily tasks for them. 
      Include spiritual tasks (prayers, adhkar, Quran) and worldly tasks (exercise, study, reading).
      
      You MUST reply ONLY with a JSON object in this exact format:
      {
        "message": "A short motivational message in the user's language.",
        "tasks": [
          { "label": "Task Name", "icon": "Emoji", "is_mandatory": true/false, "duration_min": null or integer }
        ]
      }
      Do not include any other text outside the JSON.`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: systemPrompt + "\n\nUser Goal: " + userText }] }]
        })
      });
      
      const data = await response.json();
      const rawText = data.candidates[0].content.parts[0].text;
      // Extract JSON from the response (in case AI adds markdown)
      const jsonStr = rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1);
      const parsed = JSON.parse(jsonStr);

      // 1. Add AI message to chat
      setChatMessages([...newMsgs, {role: 'model', text: parsed.message}]);

      // 2. Clear old tasks
      await sb.from('custom_tasks').delete().eq('user_id', user);

      // 3. Save new AI tasks to Database
      const rows = parsed.tasks.map((t, i) => ({
        user_id: user,
        key: 'ai_' + Date.now() + '_' + i,
        label: t.label,
        icon: t.icon || '✅',
        is_mandatory: t.is_mandatory,
        duration_min: t.duration_min || null,
        active: true
      }));

      const {data: savedTasks} = await sb.from('custom_tasks').insert(rows).select();
      setCustomTasks(savedTasks);
      showToast(t('tasksGenerated'));

    } catch (err) {
      setChatMessages([...newMsgs, {role: 'model', text: t('aiError')}]);
    }
    setIsTyping(false);
  }

  function TaskTimer({taskKey, targetMin}) {

    React.useEffect(()=>{let i;if(running)i=setInterval(()=>{const a=parseInt(localStorage.getItem('timer_'+taskKey+'_accum')||'0');setTime(a+Math.floor((Date.now()-start)/1000))},1000);return()=>clearInterval(i)},[running,start]);
    React.useEffect(()=>{if(time>=targetMin*60&&running){setRunning(false);showToast('✅ Timer complete!');uploadProof(taskKey,null,true)}},[time,running]);
    const toggle=()=>{if(!running){const n=Date.now();setStart(n);setRunning(true);localStorage.setItem('timer_'+taskKey+'_start',n);localStorage.setItem('timer_'+taskKey+'_accum',time)}else{setRunning(false);localStorage.removeItem('timer_'+taskKey+'_start');localStorage.setItem('timer_'+taskKey+'_accum',time)}};
    return(<div className={`timer-box ${running?'active':''}`} style={{marginTop: -5, marginBottom: 15, padding: 12}}><div style={{display:'flex',justifyContent:'space-between'}}><div style={{fontSize:12,color:'#888',fontWeight:'bold'}}>⏱️ {targetMin} MIN TIMER</div><div style={{fontSize:10,color:time>=targetMin*60?'#7CFF4F':'#ff4f4f'}}>{time>=targetMin*60?'✅ DONE':'IN PROGRESS'}</div></div><div className="timer-val" style={{fontSize:24, margin: '5px 0'}}>{formatTime(time)}</div><div style={{display:'flex',gap:10}}><button onClick={toggle} style={{flex:2,padding:8, background:running?'#ff4f4f':'#7CFF4F',color:running?'#fff':'#000'}}>{running?'PAUSE':'START'}</button><button onClick={()=>{setRunning(false);setTime(0);localStorage.removeItem('timer_'+taskKey+'_start');localStorage.setItem('timer_'+taskKey+'_accum','0')}} style={{flex:1,padding:8}}>RESET</button></div></div>)

                    <span className="icon">{task.icon}</span><span className="label">{task.label}</span>
                    <div className="camera-btn-container">
                      {taskData?.proof_url ? (<a href={taskData.proof_url} target="_blank" rel="noreferrer" style={{color:'#7CFF4F',fontSize:12,textDecoration:'underline',fontWeight:'bold'}}>View</a>) : (<><div className="camera-btn" onClick={()=>setOpenCameraMenu(openCameraMenu===task.key?null:task.key)}>📷</div>{openCameraMenu===task.key&&(<div className="camera-menu"><label>{t('camera')}<input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>{if(e.target.files[0])uploadProof(task.key,e.target.files[0])}}/></label><label>{t('gallery')}<input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{if(e.target.files[0])uploadProof(task.key,e.target.files[0])}}/></label></div>)}</>)}
                    </div>
                    <div className={`custom-check ${isDone?'checked':''}`} onClick={()=>toggleTask(task.key,!isDone)}>{isDone&&<span style={{color:'#000',fontWeight:'bold',fontSize:16}}>✓</span>}</div>
                  </div>
                  {task.duration_min && <div style={{gridColumn:'1 / -1', marginTop:-10}}><TaskTimer taskKey={task.key} targetMin={task.duration_min} /></div>}
                </React.Fragment>
              )})}
            </div>
            
            <h2 style={{color:'#888'}}>{t('extraXp')}</h2>
            <div className="task-grid">
              {extraTasks.map((task,i)=>{const taskData=tasks.find(x=>x.task_key===task.key);const isDone=taskData?.done;return(
                <div className={`task ${isDone?'done':''}`} key={task.key} style={{animationDelay:`${i*0.04}s`, zIndex: openCameraMenu === task.key ? 100 : 1, position: 'relative'}}>
                  <span className="icon">{task.icon}</span><span className="label">{task.label}</span>
                  <div className="camera-btn-container">
                    {taskData?.proof_url ? (<a href={taskData.proof_url} target="_blank" rel="noreferrer" style={{color:'#7CFF4F',fontSize:12,textDecoration:'underline',fontWeight:'bold'}}>View</a>) : (<><div className="camera-btn" onClick={()=>setOpenCameraMenu(openCameraMenu===task.key?null:task.key)}>📷</div>{openCameraMenu===task.key&&(<div className="camera-menu"><label>{t('camera')}<input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>{if(e.target.files[0])uploadProof(task.key,e.target.files[0])}}/></label><label>{t('gallery')}<input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{if(e.target.files[0])uploadProof(task.key,e.target.files[0])}}/></label></div>)}</>)}
                  </div>
                  <div className={`custom-check ${isDone?'checked':''}`} onClick={()=>toggleTask(task.key,!isDone)}>{isDone&&<span style={{color:'#000',fontWeight:'bold',fontSize:16}}>✓</span>}</div>
                </div>)})}
            </div>
          </>
        )}

        {page === 'goals' && (<><h2 style={{color:'#7CFF4F',textAlign:'center'}}>{t('myGoals')}</h2>{goals.length===0&&<p style={{textAlign:'center',color:'#888'}}>{t('noGoals')}</p>}{goals.map((g,i)=>(<div key={g.id} className="goal-card" style={{borderLeftColor:g.status==='done'?'#7CFF4F':'#ff4f4f',animationDelay:`${i*0.05}s`}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}><span style={{fontSize:15,fontWeight:'bold',textDecoration:g.status==='done'?'line-through':'none',color:g.status==='done'?'#888':'#fff'}}>{g.title}</span><button className="delete-btn" onClick={()=>deleteGoal(g.id)}>✕</button></div>{g.status!=='done'&&<button onClick={()=>completeGoal(g.id)} style={{marginTop:10,background:'#7CFF4F',color:'#000',padding:'6px 12px',fontSize:12,border:'none'}}>{t('markDone')}</button>}</div>))}<div className="add-task" style={{marginTop:20}}><input placeholder={t('goalPlaceholder')} value={newGoalLabel} onChange={e=>setNewGoalLabel(e.target.value)}/><button onClick={addGoal}>+</button></div></>)}

        {page === 'store' && (<><div className="rank-card"><div style={{fontSize:10,color:'#888'}}>{t('currentRank')}</div><div style={{fontSize:20,fontWeight:'bold'}}>{rank.name} • {(profile.xp||0)} {t('xp')}</div><div className="xp-bar"><div className="xp-bar-fill" style={{width:progress+'%'}}/></div><div style={{marginTop:15,fontSize:16,fontWeight:'bold',color:'#fbbf24'}}>🪙 {profile.coins||0} {t('coins')}</div></div><h2>{t('store')}</h2>{STORE.map((item,i)=>(<div className="card" key={item.id} style={{animationDelay:`${i*0.05}s`}}><div style={{fontWeight:'bold',color:'#7CFF4F'}}>{lang==='ar'?item.nameAr:item.name}</div><div style={{fontSize:12,color:'#888',margin:'5px 0'}}>{lang==='ar'?item.descAr:item.desc}</div><button onClick={()=>buyItem(item)} disabled={(profile.coins||0)<item.price} style={{width:'100%',marginTop:10}}>{t('buy')} {item.price} 🪙 {t('coins')}</button></div>))}</>)}

        {page === 'feed' && (<><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:15}}><h2 style={{margin:0}}>{t('teamChat')}</h2><button onClick={sendNudge} style={{background:'#7CFF4F',color:'#000',padding:'5px 10px',fontSize:12}}>{t('post')}</button></div>{feed.map((f,i)=>(<div className="card" key={f.id} style={{animationDelay:`${i*0.05}s`}}><div style={{display:'flex',alignItems:'center',marginBottom:5}}><img src={f.profile?.avatar_url ? f.profile.avatar_url+'?width=100' : 'https://api.dicebear.com/7.x/bottts/svg?seed='+(f.profile?.username||'User')} className="avatar-sm" alt="avatar"/><span style={{fontSize:11,color:'#7CFF4F',fontWeight:'bold'}}>{f.profile?.username||'User'}</span></div><div>{f.message}</div></div>))}<h2 style={{marginTop:30}}>{t('teamProofs')}</h2>{teamProofs.length===0&&<p style={{textAlign:'center',color:'#888'}}>{t('noProofs')}</p>}{teamProofs.map((p,i)=>{let taskLabel=p.task_key;const mTask=customTasks.find(m=>m.key===p.task_key);if(mTask)taskLabel=mTask.label;return(<div className="proof-card" key={p.id} style={{animationDelay:`${i*0.05}s`}}>{p.proof_url.includes('?txt=1')?(<div style={{padding:20,textAlign:'center',background:'#1e293b',color:'#7CFF4F',fontWeight:'bold'}}>📜 Timer Certificate Verified</div>):(<img src={p.proof_url + '?width=600'} alt="Proof" className="proof-img" onClick={()=>window.open(p.proof_url,'_blank')}/>)}<div className="proof-info"><div style={{display:'flex',alignItems:'center'}}><img src={p.profile?.avatar_url ? p.profile.avatar_url+'?width=100' : 'https://api.dicebear.com/7.x/bottts/svg?seed='+(p.profile?.username||'User')} className="avatar-sm" alt="avatar"/><div><div style={{fontWeight:'bold',color:'#fff'}}>{p.profile?.username||'User'}</div><div style={{fontSize:11,color:'#888'}}>{taskLabel}</div></div></div></div></div>)})}</>)}

        {page === 'ranks' && (<><h2 style={{textAlign:'center',color:'#7CFF4F'}}>{t('globalRanks')}</h2><table style={{width:'100%',borderCollapse:'collapse'}}><thead><tr><th style={{textAlign:lang==='ar'?'right':'left',color:'#888',fontSize:10}}>#</th><th style={{textAlign:lang==='ar'?'right':'left',color:'#888',fontSize:10}}>{t('member')}</th><th style={{textAlign:lang==='ar'?'left':'right',color:'#888',fontSize:10}}>{t('xp')}</th></tr></thead><tbody>{leaderboard.map((r,i)=>(<tr key={r.user_id} style={{borderBottom:'1px solid #222',animation:`fadeInUp 0.4s ease-out ${i*0.03}s both`}}><td style={{padding:15}}>{i+1}</td><td style={{padding:15,fontWeight:r.user_id===user?'bold':'normal',color:r.user_id===user?'#7CFF4F':'#fff'}}><div style={{display:'flex',alignItems:'center'}}><img src={r.avatar_url ? r.avatar_url+'?width=100' : 'https://api.dicebear.com/7.x/bottts/svg?seed='+r.username} className="avatar-sm" alt="avatar"/><div>{r.username}<br/><span style={{fontSize:10,color:'#888'}}>{r.team_name} • {r.title||'Rookie'}</span></div></div></td><td style={{padding:15,textAlign:lang==='ar'?'left':'right'}}>{r.xp}</td></tr>))}</tbody></table></>)}

        {page === 'ai' && (
          <div style={{display:'flex', flexDirection:'column', height:'calc(100vh - 200px)'}}>
            <h2 style={{color:'#7CFF4F', textAlign:'center'}}>{t('aiTab')} 🤖</h2>
            <div style={{flex:1, overflowY:'auto', padding:'10px', background:'#0a0a0a', borderRadius:12, border:'1px solid #222', marginBottom:10, display:'flex', flexDirection:'column', gap:10}}>
               {chatMessages.map((m,i)=>(<div key={i} style={{alignSelf: m.role==='user'?'flex-end':'flex-start', background:m.role==='user'?'#7CFF4F':'#1e293b', color:m.role==='user'?'#000':'#fff', padding:'10px 15px', borderRadius:12, maxWidth:'85%', fontSize:14, whiteSpace:'pre-wrap'}}>{m.text}</div>))}
               {isTyping && <div style={{alignSelf:'flex-start', color:'#888', fontSize:12}}>{t('aiGenerating')}</div>}
            </div>
            <form onSubmit={sendAIMessage} style={{display:'flex', gap:5}}>
              <input value={chatInput} onChange={e=>setChatInput(e.target.value)} placeholder={t('aiPlaceholder')} style={{marginBottom:0, flex:1}} />
              <button type="submit" className="primary" style={{width:'auto', padding:'0 20px', fontSize:18}}>↑</button>
            </form>
          </div>
        )}
      </div>

      <nav>
        <button className={page==='home'?'active':''} onClick={()=>changePage('home')}><span>🏠</span>{t('home')}</button>
        <button className={page==='goals'?'active':''} onClick={()=>changePage('goals')}><span>🎯</span>{t('goalsTab')}</button>
        <button className={page==='store'?'active':''} onClick={()=>changePage('store')}><span>🛒</span>{t('store')}</button>
        <button className={page==='feed'?'active':''} onClick={()=>changePage('feed')}><span>💬</span>{t('feed')}</button>
        <button className={page==='ranks'?'active':''} onClick={()=>changePage('ranks')}><span>🏆</span>{t('ranks')}</button>
        <button className={page==='ai'?'active':''} onClick={()=>changePage('ai')}><span>🤖</span>{t('aiTab')}</button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
